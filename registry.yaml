    repo: https://github.com/external-secrets/external-secrets
    docs: https://external-secrets.io/latest/api/generator/
    release: {tags: '^v[0-9]+[.][0-9]+[.][0-9]+$'}
    source: {path: config/crds/bases}
    crds: [upstream/eso-generators/config/crds/bases/generators.external-secrets.io_passwords.yaml,
           upstream/eso-generators/config/crds/bases/generators.external-secrets.io_uuids.yaml]
    install:
      - name: Helm
        note: The generators come with External Secrets Operator itself; an ExternalSecret references one to write its value to a Secret.
