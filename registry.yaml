# The registry's sources: which providers and package catalogs it indexes,
# where their CRDs and docs are, and how they relate. Each repository of ours
# may also describe itself in a `krm-registry.yaml` at its root (like
# terraform-registry-manifest.json); today that carries `install:`, read by
# config.py. A provider's `install:` here overrides its repository's: that is
# the registry's account of providers we do not control (README, "Install variants").
schema: 1

# A surface is a cloud or a vendor. `terraform` names its Terraform provider:
# resolve.py reads its rank, downloads and resource list from the Terraform
# Registry API, and the registry shows how much of it the kinds cover.
surfaces:
  gcp:        {title: Google Cloud, category: cloud, terraform: hashicorp/google}
  aws:        {title: Amazon Web Services, category: cloud, terraform: hashicorp/aws}
  azure:      {title: Microsoft Azure, category: cloud, terraform: hashicorp/azurerm}
  datadog:    {title: Datadog, category: observability, terraform: DataDog/datadog}
  github:     {title: GitHub, category: developer platform, terraform: integrations/github}
  cloudflare: {title: Cloudflare, category: edge and DNS, terraform: cloudflare/cloudflare}
  grafana:    {title: Grafana, category: observability, terraform: grafana/grafana}
  gitlab:     {title: GitLab, category: developer platform, terraform: gitlabhq/gitlab}
  vault:      {title: Vault, category: secrets, terraform: hashicorp/vault}
  confluent:  {title: Confluent Cloud, category: data streaming, terraform: confluentinc/confluent,
               notes: "Confluent for Kubernetes (CFK) manages topics, schemas, connectors, role bindings, cluster links and schema exporters, some of them on Confluent Cloud; it is not indexed here because its CRDs ship only in Confluent's Helm chart, not in a public repository."}
  databricks: {title: Databricks, category: data platform, terraform: databricks/databricks,
               notes: "Databricks publishes no OpenAPI spec, so there is no generated extension yet; the community databricks-kube-operator covers jobs, repos, secrets and git credentials."}
  pagerduty:  {title: PagerDuty, category: incident response, terraform: PagerDuty/pagerduty}
  sentry:     {title: Sentry, category: observability, terraform: jianyuan/sentry,
               notes: "Sentry publishes no Kubernetes operator. Two community projects exist (jace-ys/sentry-operator, last updated 2021; sr/kube-sentry-controller, 2023) and cover only teams, projects and client keys; neither is indexed here."}
  newrelic:   {title: New Relic, category: observability, terraform: newrelic/newrelic,
               notes: "New Relic's configuration API is NerdGraph (GraphQL), which the REST runtime does not drive; its old Kubernetes operator (alert policies and conditions, v0.0.8) is unmaintained. Not covered yet."}
  oci:        {title: Oracle Cloud, category: cloud, terraform: oracle/oci,
               notes: "Oracle's OCI Service Operator is indexed at its latest tag. Its main branch carries 475 CRDs (about 320 Terraform resources' worth) not yet in a release."}
  mongodbatlas: {title: MongoDB Atlas, category: database, terraform: mongodb/mongodbatlas}
  okta:       {title: Okta, category: identity, terraform: okta/okta}
  snowflake:  {title: Snowflake, category: data platform, terraform: snowflakedb/snowflake}
  artifactory: {title: JFrog Artifactory, category: developer platform, terraform: jfrog/artifactory,
               notes: "JFrog publishes Crossplane providers (provider-artifactory: 214 kinds; also xray, project and platform) as images in its authenticated registry, with no public source; they are not indexed here. Nothing to extend: they cover nearly all of the Terraform provider."}
  alicloud:   {title: Alibaba Cloud, category: cloud, terraform: aliyun/alicloud,
               notes: "No Kubernetes operator manages Alibaba Cloud resources (ACK's own CRDs run in-cluster software), and the API is RPC-style with request signing, which the REST runtime does not drive. Not covered yet."}

# Terraform types each operator kind stands in for (generated extension
# kinds carry theirs in the CRD's hfl.dev/terraform annotation).
terraform_map: terraform-map.yaml

providers:
  - id: config-connector
    title: Config Connector
    surface: gcp
    publisher: Google
    tier: official
    repo: https://github.com/GoogleCloudPlatform/k8s-config-connector
    docs: https://docs.cloud.google.com/config-connector/docs/overview
    version: latest release   # resolved into registry.lock.json
    crds: [upstream/kcc/config/crds/resources/*.yaml]
    group_suffix: .cnrm.cloud.google.com

  # Installs and configures Config Connector itself. Google ships it as a tarball in a
  # public Cloud Storage bucket, one folder per version, not as a GitHub release.
  - id: config-connector-operator
    title: Config Connector operator
    surface: gcp
    publisher: Google
    tier: official
    manages: in-cluster
    installs: config-connector
    repo: https://github.com/GoogleCloudPlatform/k8s-config-connector
    docs: https://docs.cloud.google.com/config-connector/docs/how-to/install-manually
    release: {gcs: configconnector-operator}            # the newest version folder
    source: {gcs: 'configconnector-operator/{tag}/release-bundle.tar.gz'}
    # Standard and Autopilot manifests carry the same CRDs; read one.
    crds: [upstream/config-connector-operator/operator-system/configconnector-operator.yaml]
    group_suffix: .cnrm.cloud.google.com
    install:
      # Shown only while cr.highfivelabs.dev serves this chart at the version
      # documented (resolve.py checks the manifest; see README "Install variants").
      - name: High Five Labs chart
        oci: charts/config-connector
        when: GKE Standard, GKE Autopilot (--set variant=autopilot), and clusters outside GKE
        note: >-
          One chart: Google's operator and its CRDs, unmodified, plus a ConfigConnector made from
          values; the operator then installs Config Connector itself. The operator image is
          Google's, copied by digest; the last two commands should print the same digest.
          Uninstall with helm uninstall (a hook deletes the ConfigConnector first).
        steps: |
          helm install config-connector oci://cr.highfivelabs.dev/charts/config-connector \
            --version {tag} \
            --namespace configconnector-operator-system --create-namespace \
            --set googleServiceAccount=kcc@PROJECT_ID.iam.gserviceaccount.com

          # Same bytes as Google's release:
          crane digest cr.highfivelabs.dev/upstream/config-connector/operator:{tag}
          crane digest gcr.io/gke-release/cnrm/operator:{tag}
      - name: GKE Standard
        when: Standard clusters, and clusters outside GKE
        steps: |
          gcloud storage cp gs://configconnector-operator/{tag}/release-bundle.tar.gz release-bundle.tar.gz
          tar zxvf release-bundle.tar.gz
          kubectl apply -f operator-system/configconnector-operator.yaml
      - name: GKE Autopilot
        when: Autopilot clusters
        note: Same kinds; the operator installs Config Connector from its Autopilot channel.
        steps: |
          gcloud storage cp gs://configconnector-operator/{tag}/release-bundle.tar.gz release-bundle.tar.gz
          tar zxvf release-bundle.tar.gz
          kubectl apply -f operator-system/autopilot-configconnector-operator.yaml

  - id: ack
    title: AWS Controllers for Kubernetes
    surface: aws
    publisher: Amazon Web Services
    tier: official
    repo: https://github.com/aws-controllers-k8s
    docs: https://aws-controllers-k8s.github.io/community/
    version: per controller   # each controller's latest release, resolved into registry.lock.json
    crds: [upstream/ack/*/helm/crds/*.yaml]
    group_suffix: .services.k8s.aws
    # Not ours: registry.yaml's install: is the registry's account of upstream's steps.
    install:
      - name: Helm (one controller per service)
        when: any cluster; one release per AWS service, each at that controller's own latest release
        note: >-
          Credentials: on EKS, an IAM role for the controller's service account (Pod Identity, or
          IRSA with --set serviceAccount.annotations.eks\.amazonaws\.com/role-arn=ROLE_ARN);
          elsewhere, an AWS credentials Secret (aws.credentials.secretName). Pulls from
          public.ecr.aws are anonymous; a helm registry login raises its rate limit.
        tested: 2026-11-25, references resolved at this version and the chart rendered with these values (helm template)
        steps: |
          SERVICE=s3 AWS_REGION=us-west-2
          RELEASE_VERSION=$(curl -sL https://api.github.com/repos/aws-controllers-k8s/$SERVICE-controller/releases/latest \
            | jq -r '.tag_name | ltrimstr("v")')
          helm install ack-$SERVICE-controller oci://public.ecr.aws/aws-controllers-k8s/$SERVICE-chart \
            --version $RELEASE_VERSION \
            --namespace ack-system --create-namespace \
            --set aws.region=$AWS_REGION

  - id: aso
    title: Azure Service Operator v2
    surface: azure
    publisher: Microsoft
    tier: official
    repo: https://github.com/Azure/azure-service-operator
    docs: https://azure.github.io/azure-service-operator/
    version: latest v2 release
    crds: [upstream/aso-crds.yaml]
    group_suffix: .azure.com
    install:
      - name: Helm
        when: any cluster with cert-manager (installed first below)
        note: >-
          crdPattern chooses which groups' CRDs the operator installs; it installs none without it.
          Credentials here are a service principal's secret; for workload identity set
          useWorkloadIdentityAuth=true and drop azureClientSecret
          (azure.github.io/azure-service-operator/guide/authentication).
        tested: 2026-11-25, references resolved at this version and the chart rendered with these values (helm template)
        steps: |
          kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.21.3/cert-manager.yaml
          kubectl wait -n cert-manager --for=condition=Available deployment --all --timeout=5m

          helm repo add aso2 https://raw.githubusercontent.com/Azure/azure-service-operator/main/v2/charts
          helm install aso2 aso2/azure-service-operator --version {version} \
            --namespace azureserviceoperator-system --create-namespace \
            --set crdPattern='resources.azure.com/*;containerservice.azure.com/*;keyvault.azure.com/*;managedidentity.azure.com/*' \
            --set azureSubscriptionID=$AZURE_SUBSCRIPTION_ID \
            --set azureTenantID=$AZURE_TENANT_ID \
            --set azureClientID=$AZURE_CLIENT_ID \
            --set azureClientSecret=$AZURE_CLIENT_SECRET

  - id: config-connector-extensions
    title: config-connector-extensions
    surface: gcp
    publisher: High Five Labs
    tier: extension
    extends: config-connector
    repo: https://github.com/highfivelabs/config-connector-extensions
    version: main
    crds: [src/config-connector-extensions/config/crds/*.yaml]
    kind_docs: src/config-connector-extensions/docs/kinds
    readme: src/config-connector-extensions/README.md
    coverage: src/config-connector-extensions/docs/coverage/resources.csv
    terraform: src/krm-packages/docs/terraform/config-connector-extensions/terraform-resources.csv
    group_suffix: .gcp.hfl.dev

  - id: ack-extensions
    title: ack-extensions
    surface: aws
    publisher: High Five Labs
    tier: extension
    extends: ack
    repo: https://github.com/highfivelabs/ack-extensions
    version: main
    crds: [src/ack-extensions/config/crds/bases/*.yaml, src/ack-extensions/cloudcontrol/config/crds/*.yaml]
    readme: src/ack-extensions/README.md
    coverage: src/ack-extensions/docs/coverage/resources.csv
    terraform: src/krm-packages/docs/terraform/ack-extensions/terraform-resources.csv
    group_suffix: .aws.hfl.dev

  - id: aso-extensions
    title: aso-extensions
    surface: azure
    publisher: High Five Labs
    tier: extension
    extends: aso
    repo: https://github.com/highfivelabs/aso-extensions
    version: main
    crds: [src/aso-extensions/config/crds/*.yaml]
    readme: src/aso-extensions/README.md
    coverage: src/aso-extensions/docs/coverage/resources.csv
    terraform: src/krm-packages/docs/terraform/aso-extensions/terraform-resources.csv
    group_suffix: .azure.hfl.dev

  # The long tail. Operators: each at its latest release (resolve.py),
  # CRDs from a release asset or a path in the repository (fetch_sources.py).
  # manages: external-api (configures the vendor's service) or in-cluster
  # (installs and runs software in the cluster).
  - id: grafana-operator
    title: Grafana Operator
    surface: grafana
    publisher: Grafana Labs
    tier: official
    manages: external-api
    repo: https://github.com/grafana/grafana-operator
    docs: https://grafana.github.io/grafana-operator/docs/
    release: {tags: '^v[0-9]+[.][0-9]+[.][0-9]+$'}
    source: {asset: 'https://github.com/grafana/grafana-operator/releases/download/{tag}/crds.yaml'}
    crds: [upstream/grafana-operator/*.yaml]
    install:
      - name: Helm (OCI)
        note: A Grafana instance it manages is a Grafana resource (in-cluster, or external with an API key Secret).
        tested: 2026-11-25, references resolved at this version and the chart rendered with these values (helm template)
        steps: |
          helm install grafana-operator oci://ghcr.io/grafana/helm-charts/grafana-operator \
            --version {version} \
            --namespace grafana-operator --create-namespace

  - id: datadog-operator
    title: Datadog Operator
    surface: datadog
    publisher: Datadog
    tier: official
    manages: external-api
    repo: https://github.com/DataDog/datadog-operator
    docs: https://docs.datadoghq.com/containers/datadog_operator/
    release: {tags: '^v[0-9]+[.][0-9]+[.][0-9]+$'}
    source: {path: config/crd/bases/v1}
    crds: [upstream/datadog-operator/config/crd/bases/v1/*.yaml]
    install:
      - name: Helm
        note: >-
          The chart's version is not the operator's: chart 2.33.0 ships operator 1.32.0
          (helm search repo datadog/datadog-operator --versions lists which carries which).
          The monitor, dashboard, SLO and generic-resource controllers are off by default; the
          --set flags below turn them on. The app key needs the scopes of what it manages.
        tested: 2026-11-25, references resolved at this version and the chart rendered with these values (helm template)
        steps: |
          helm repo add datadog https://helm.datadoghq.com
          kubectl create namespace datadog
          kubectl create secret generic datadog-secret -n datadog \
            --from-literal api-key=$DD_API_KEY --from-literal app-key=$DD_APP_KEY
          helm install datadog-operator datadog/datadog-operator -n datadog \
            --set apiKeyExistingSecret=datadog-secret --set appKeyExistingSecret=datadog-secret \
            --set site=datadoghq.com \
            --set datadogMonitor.enabled=true --set datadogDashboard.enabled=true \
            --set datadogSLO.enabled=true --set datadogGenericResource.enabled=true

  - id: stringke-cloudflare-operator
    title: cloudflare-operator (StringKe)
    surface: cloudflare
    publisher: StringKe (community)
    tier: community
    manages: external-api
    repo: https://github.com/StringKe/cloudflare-operator
    release: {tags: '^v[0-9]+[.][0-9]+[.][0-9]+$'}
    source: {asset: 'https://github.com/StringKe/cloudflare-operator/releases/download/{tag}/cloudflare-operator-crds.yaml'}
    crds: [upstream/stringke-cloudflare-operator/*.yaml]
    install:
      - name: Release manifest
        note: >-
          CRDs, namespace, RBAC and the operator, without the webhook. cloudflare-operator-full.yaml
          at the same release adds the webhook and needs cert-manager. Each resource names a
          Secret holding a Cloudflare API token.
        tested: 2026-11-25, the release asset fetched at this version
        steps: |
          kubectl apply -f https://github.com/StringKe/cloudflare-operator/releases/download/{tag}/cloudflare-operator-full-no-webhook.yaml

  - id: adyanth-cloudflare-operator
    title: cloudflare-operator (adyanth)
    surface: cloudflare
    publisher: adyanth (community)
    tier: community
    manages: external-api
    repo: https://github.com/adyanth/cloudflare-operator
    release: {tags: '^v[0-9]+[.][0-9]+[.][0-9]+$'}
    source: {path: config/crd/bases}
    crds: [upstream/adyanth-cloudflare-operator/config/crd/bases/*.yaml]
    install:
      - name: Kustomize
        when: clusters with cert-manager (config/default carries a cert-manager Issuer and Certificates)
        note: Into cloudflare-operator-system. Each Tunnel names a Secret with a Cloudflare API token or key.
        tested: 2026-11-25, the tag's config/default built (kubectl kustomize)
        steps: |
          kubectl apply -k 'https://github.com/adyanth/cloudflare-operator.git//config/default?ref={tag}'

  - id: git-hubby
    title: git-hubby
    surface: github
    publisher: Interhyp (community)
    tier: community
    manages: external-api
    repo: https://github.com/Interhyp/git-hubby
    release: {tags: '^v[0-9]+[.][0-9]+[.][0-9]+$'}
    source: {path: config/crd/bases}
    crds: [upstream/git-hubby/config/crd/bases/*.yaml]
    install:
      - name: Helm (OCI)
        when: clusters with cert-manager (for its webhook and metrics certificates)
        note: >-
          The chart is versioned apart from the operator (chart 1.25.0 ships operator 0.13.0); omit
          --version for the newest. It authenticates as a GitHub App installation: values.yaml
          names the App's credentials Secret (github.com/Interhyp/git-hubby-helm).
        tested: 2026-11-25, references resolved at this version and the chart rendered with these values (helm template)
        steps: |
          helm install git-hubby oci://ghcr.io/interhyp/git-hubby-helm/git-hubby \
            --namespace git-hubby --create-namespace \
            -f values.yaml

  - id: actions-runner-controller
    title: Actions Runner Controller
    surface: github
    publisher: GitHub
    tier: official
    manages: in-cluster
    repo: https://github.com/actions/actions-runner-controller
    docs: https://docs.github.com/en/actions/hosting-your-own-runners/managing-self-hosted-runners-with-actions-runner-controller
    release: {tags: '^gha-runner-scale-set-[0-9]+[.][0-9]+[.][0-9]+$'}
    source: {path: charts/gha-runner-scale-set-controller/crds}
    crds: [upstream/actions-runner-controller/charts/gha-runner-scale-set-controller/crds/*.yaml]
    install:
      - name: Helm (OCI)
        note: >-
          The controller; each runner scale set is then its own release of
          oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set, with a GitHub
          App or token Secret and the repository, organization or enterprise URL.
        tested: 2026-11-25, references resolved at this version and the chart rendered with these values (helm template)
        steps: |
          helm install arc oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set-controller \
            --version {version} \
            --namespace arc-systems --create-namespace

  - id: gitlab-operator
    title: GitLab Operator
    surface: gitlab
    publisher: GitLab
    tier: official
    manages: in-cluster
    repo: https://gitlab.com/gitlab-org/cloud-native/gitlab-operator
    docs: https://docs.gitlab.com/operator/
    release: {tags: '^[0-9]+[.][0-9]+[.][0-9]+$'}
    source: {path: config/crd/bases}
    crds: [upstream/gitlab-operator/config/crd/bases/*.yaml]
    install:
      - name: Helm
        when: clusters with cert-manager and an ingress controller (docs.gitlab.com/operator/installation)
        tested: 2026-11-25, references resolved at this version and the chart rendered with these values (helm template)
        steps: |
          helm repo add gitlab-operator https://gitlab.com/api/v4/projects/18899486/packages/helm/stable
          helm install gitlab-operator gitlab-operator/gitlab-operator --version {version} \
            --namespace gitlab-system --create-namespace

  - id: gitlab-runner-operator
    title: GitLab Runner Operator
    surface: gitlab
    publisher: GitLab
    tier: official
    manages: in-cluster
    repo: https://gitlab.com/gitlab-org/gl-openshift/gitlab-runner-operator
    docs: https://docs.gitlab.com/runner/install/operator/
    release: {tags: '^v[0-9]+[.][0-9]+[.][0-9]+$'}
    source: {path: config/crd/bases}
    crds: [upstream/gitlab-runner-operator/config/crd/bases/*.yaml]
    install:
      - name: OperatorHub (OLM)
        when: Kubernetes with the Operator Lifecycle Manager (installed first below); on OpenShift, from OperatorHub
        note: >-
          The Subscription follows the stable channel, so OLM installs its newest release, not
          necessarily the one documented here. Runners are then Runner resources naming a Secret
          with a runner authentication token.
        tested: 2026-11-25, the OLM installer and the OperatorHub Subscription fetched
        steps: |
          curl -sL https://github.com/operator-framework/operator-lifecycle-manager/releases/download/v0.46.0/install.sh | bash -s v0.46.0
          kubectl create -f https://operatorhub.io/install/gitlab-runner-operator.yaml

  - id: oci-service-operator
    title: OCI Service Operator
    surface: oci
    publisher: Oracle
    tier: official
    manages: external-api
    repo: https://github.com/oracle/oci-service-operator
    docs: https://github.com/oracle/oci-service-operator/tree/main/docs
    release: {tags: '^v[0-9]+[.][0-9]+[.][0-9]+(-alpha)?$'}
    source: {path: config/crd/bases}
    crds: [upstream/oci-service-operator/config/crd/bases/*.yaml]
    install:
      - name: OLM bundle, per service
        when: Kubernetes with the Operator Lifecycle Manager; one bundle per OCI service package
        note: >-
          GROUP is the package (apigateway, containerengine, containerinstances, core-network,
          database, dataflow, functions, identity, mysql, nosql, objectstorage, opensearch, psql,
          queue, redis, streaming, vault). Each runs in oci-service-operator-GROUP-system and reads
          an ocicredentials Secret there, or uses instance principals (Oracle's docs/installation.md).
          Oracle marks this release alpha: try it in a test cluster first.
        tested: 2026-11-25, the mysql and streaming bundles resolved at this tag
        steps: |
          operator-sdk olm install
          GROUP=mysql
          operator-sdk run bundle ghcr.io/oracle/oci-service-operator-$GROUP-bundle:{tag}

  - id: atlas-kubernetes-operator
    title: Atlas Kubernetes Operator
    surface: mongodbatlas
    publisher: MongoDB
    tier: official
    manages: external-api
    repo: https://github.com/mongodb/mongodb-atlas-kubernetes
    docs: https://www.mongodb.com/docs/atlas/operator/current/
    release: {tags: '^v[0-9]+[.][0-9]+[.][0-9]+$'}
    source: {path: 'releases/{newest}/deploy/crds'}
    crds: [upstream/atlas-kubernetes-operator/crds/*.yaml]
    install:
      - name: Helm
        note: >-
          The global connection Secret takes an Atlas service account (clientId, clientSecret;
          recommended) or a legacy API key (publicApiKey, privateApiKey) in place of the two
          service-account flags below.
        tested: 2026-11-25, references resolved at this version and the chart rendered with these values (helm template)
        steps: |
          helm repo add mongodb https://mongodb.github.io/helm-charts
          helm install atlas-operator mongodb/mongodb-atlas-operator --version {version} \
            --namespace mongodb-atlas-system --create-namespace \
            --set globalConnectionSecret.orgId=$ATLAS_ORG_ID \
            --set globalConnectionSecret.clientId=$ATLAS_CLIENT_ID \
            --set globalConnectionSecret.clientSecret=$ATLAS_CLIENT_SECRET

  - id: vault-config-operator
    title: vault-config-operator
    surface: vault
    publisher: Red Hat Community of Practice (community)
    tier: community
    manages: external-api
    repo: https://github.com/redhat-cop/vault-config-operator
    release: {tags: '^v[0-9]+[.][0-9]+[.][0-9]+$'}
    source: {path: config/crd/bases}
    crds: [upstream/vault-config-operator/config/crd/bases/*.yaml]
    install:
      - name: Helm
        when: clusters with cert-manager, for its webhooks' certificates (on OpenShift, drop enableCertManager)
        note: >-
          It reaches Vault through Vault's standard environment variables (VAULT_ADDR, VAULT_CACERT, ...)
          on its deployment; each resource names the Kubernetes auth role it signs in with.
        tested: 2026-11-25, references resolved at this version and the chart rendered with these values (helm template)
        steps: |
          helm repo add vault-config-operator https://redhat-cop.github.io/vault-config-operator
          helm install vault-config-operator vault-config-operator/vault-config-operator --version {tag} \
            --namespace vault-config-operator --create-namespace \
            --set enableCertManager=true \
            --set 'env[0].name=VAULT_ADDR' --set 'env[0].value=https://vault.example.com:8200'

  - id: vault-secrets-operator
    title: Vault Secrets Operator
    surface: vault
    publisher: HashiCorp
    tier: official
    manages: in-cluster
    repo: https://github.com/hashicorp/vault-secrets-operator
    docs: https://developer.hashicorp.com/vault/docs/platform/k8s/vso
    release: {tags: '^v[0-9]+[.][0-9]+[.][0-9]+$'}
    source: {path: config/crd/bases}
    crds: [upstream/vault-secrets-operator/config/crd/bases/*.yaml]
    install:
      - name: Helm
        note: Point it at Vault with a VaultConnection and VaultAuth (or the chart's defaultVaultConnection and defaultAuthMethod values).
        tested: 2026-11-25, references resolved at this version and the chart rendered with these values (helm template)
        steps: |
          helm repo add hashicorp https://helm.releases.hashicorp.com
          helm install vault-secrets-operator hashicorp/vault-secrets-operator --version {version} \
            --namespace vault-secrets-operator-system --create-namespace

  - id: databricks-kube-operator
    title: databricks-kube-operator
    surface: databricks
    publisher: mach-kernel (community)
    tier: community
    manages: external-api
    repo: https://github.com/mach-kernel/databricks-kube-operator
    release: {tags: '^databricks-kube-operator-[0-9]+[.][0-9]+[.][0-9]+$'}
    source: {path: charts/databricks-kube-operator/templates}
    crds: [upstream/databricks-kube-operator/charts/databricks-kube-operator/templates/crds.yaml]
    install:
      - name: Helm
        note: The operator reads its workspace URL and token from the Secret its ConfigMap names (both below, in the release's namespace).
        tested: 2026-11-25, references resolved at this version and the chart rendered with these values (helm template)
        steps: |
          helm repo add mach https://mach-kernel.github.io/databricks-kube-operator
          helm install databricks-kube-operator mach/databricks-kube-operator --version {version} \
            --namespace databricks --create-namespace
          kubectl create configmap databricks-kube-operator -n databricks \
            --from-literal api_secret_name=databricks-api-secret
          kubectl create secret generic databricks-api-secret -n databricks \
            --from-literal access_token=$DATABRICKS_TOKEN \
            --from-literal databricks_url=https://my-tenant.cloud.databricks.com/api

