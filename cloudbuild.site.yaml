# Build the site and publish it to registry.highfivelabs.dev (publish.sh).
#
# Run by the Cloud Build trigger krm-registry-site in highfivelabs-prd
# (tf-infra, README "KRM Registry") on every push to main that changes what
# the site is built from, and once a day from Cloud Scheduler, so upstream
# releases show up with no merge here. It runs as registry-publisher@, the
# only account that may write the bucket, so publish.sh writes as itself
# (REGISTRY_IMPERSONATE=0). Its GitHub token is minted from the
# krm-registry-reader App (Metadata: read only; every repository the build
# reads is public), whose key is the secret registry-github-app-key.
steps:
  - id: publish
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:stable
    entrypoint: bash
    secretEnv: [APP_KEY]
    env:
      - REGISTRY_IMPERSONATE=0
      - REGISTRY_ROOT=/workspace/.root
    args:
      - -euo
      - pipefail
      - -c
      - |
        export DEBIAN_FRONTEND=noninteractive
        apt-get -qq update && apt-get -qq install -y --no-install-recommends python3-yaml openssl git curl ca-certificates >/dev/null
        umask 077 && printf '%s\n' "$$APP_KEY" > /tmp/app.pem
        token=$$(hack/github-app-token.sh "${_APP_ID}" /tmp/app.pem)
        rm /tmp/app.pem
        export GITHUB_TOKEN=$$token
        ./publish.sh
availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/registry-github-app-key/versions/latest
      env: APP_KEY
substitutions:
  # krm-registry-reader's App ID; the trigger sets it (tf-infra).
  _APP_ID: ""
options:
  # Builds run as a named service account, so logs go to Cloud Logging only.
  logging: CLOUD_LOGGING_ONLY
  # The build fetches ~75 upstream repositories in parallel and writes ~10,000 pages.
  machineType: E2_HIGHCPU_8
  substitutionOption: MUST_MATCH
timeout: 3600s
