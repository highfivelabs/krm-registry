# Build the registry and publish it to GitHub Pages.
#
# Runs on every push to main, nightly (to pick up new provider releases, new
# module releases and changes merged in the extension repos and the catalog),
# by hand, and on a `source-changed` repository_dispatch, which the extension
# repos and the catalog can send when they merge (README: "Rebuilding on change").
#
# Upstream is only read. resolve.py asks GitHub's API (with this run's token)
# and the Terraform Registry's public API which releases exist; fetch.sh
# downloads the CRDs at those releases.
name: pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 7 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [source-changed]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install pyyaml==6.0.3
      - name: Build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./build.sh "$RUNNER_TEMP/root" site
      - name: Show what was documented
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          l = json.load(open("site/registry.lock.json"))
          p = l["providers"]
          print(f"Config Connector {p['config-connector']['tag']} · ASO {p['aso']['tag']} · {len(p['ack']['controllers'])} ACK controllers\n")
          behind = {k: v for k, v in l["modules"].items() if v["behind"]}
          print(f"{len(behind)} of {len(l['modules'])} packages behind their upstream module:\n")
          for k, v in sorted(behind.items()):
              print(f"- {k}: {v['pinned']} → {v['latest']} ({v['via']})")
          PY
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
