<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KRM Registry</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<meta name="theme-color" content="#b93d0b">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>try{var t=localStorage.getItem("krm-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
:root{
  /* High Five Labs tokens (website repo, brand/tokens.css), mapped onto this page's names. */
  --bg:#f3f5f7;--panel:#fff;--ink:#222a33;--ink2:#4a5866;--ink3:#5f6a79;--line:#d3dae1;--line2:#eef1f6;
  --clay:#b93d0b;--acc:#2f47c4;--acc-bg:#e8ebfa;
  --gcp:#1a73e8;--aws:#c06a00;--azure:#0a6fb0;
  --off:#1b7a3d;--off-bg:#e3f2e8;--ext:#2f47c4;--ext-bg:#e8ebfa;
  --alpha:#8a5a00;--alpha-bg:#fbf0dc;--beta:#8a5a00;--beta-bg:#fbf6dc;
  --display:"Familjen Grotesk","Helvetica Neue",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0d1217;--panel:#131a22;--ink:#d3d9df;--ink2:#9eabb7;--ink3:#8794a4;--line:#27313b;--line2:#0f151c;
  --clay:#ff8f57;--acc:#9aabff;--acc-bg:#1a2140;--off:#63d08e;--off-bg:#13261b;--ext:#9aabff;--ext-bg:#1a2140;
  --alpha:#e6b450;--alpha-bg:#2b2110;--beta:#e6b450;--beta-bg:#2b2610;
  --gcp:#8ab4f8;--aws:#f0a040;--azure:#5cb3f0;
color-scheme:dark}}
:root[data-theme=dark]{
  --bg:#0d1217;--panel:#131a22;--ink:#d3d9df;--ink2:#9eabb7;--ink3:#8794a4;--line:#27313b;--line2:#0f151c;
  --clay:#ff8f57;--acc:#9aabff;--acc-bg:#1a2140;--off:#63d08e;--off-bg:#13261b;--ext:#9aabff;--ext-bg:#1a2140;
  --alpha:#e6b450;--alpha-bg:#2b2110;--beta:#e6b450;--beta-bg:#2b2610;
  --gcp:#8ab4f8;--aws:#f0a040;--azure:#5cb3f0;
color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;font:15px/1.55 var(--body);background:var(--bg);color:var(--ink)}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}
code,.mono{font-family:var(--mono);font-size:12.5px}
header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:22px;padding:10px 28px}
.logo{font-weight:700;font-size:18px;color:var(--ink);display:flex;gap:9px;align-items:center;white-space:nowrap}.logo:hover{text-decoration:none}
.theme{font:inherit;background:none;border:1px solid var(--line);border-radius:999px;width:34px;height:34px;display:grid;place-items:center;color:var(--ink2);cursor:pointer;flex:none;margin-left:auto}.theme:hover{border-color:var(--clay);color:var(--ink)}.theme svg{width:16px;height:16px}
.logo svg{width:30px;height:30px;flex:none}.logo .m{fill:var(--ink)}.logo .c{fill:var(--clay)}.logo .cl{stroke:var(--clay)}
.logo small{font-family:var(--body);font-weight:500;font-size:12px;color:var(--ink3);margin-left:2px}
nav a{color:var(--ink2);margin-right:16px;font-weight:500}
#q{flex:1;max-width:520px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
main{max-width:1180px;margin:0 auto;padding:28px}
h1,h2,h3,.stat,.logo{font-family:var(--display)}h1{font-size:28px;margin:0 0 4px;letter-spacing:-.01em;line-height:1.1}h2{font-size:19px;margin:34px 0 12px}h3{font-size:14px;margin:18px 0 6px}
.sub{color:var(--ink2)}
.muted{color:var(--ink3)}
.grid{display:grid;gap:14px}.g3{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}.g4{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
a.card{color:inherit;display:block}a.card:hover{border-color:var(--acc);text-decoration:none}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:99px;border:1px solid transparent;white-space:nowrap;vertical-align:1px}
.b-official{background:var(--off-bg);color:var(--off)}.b-extension{background:var(--ext-bg);color:var(--ext)}
.b-ga{background:var(--off-bg);color:var(--off)}.b-alpha,.b-preview{background:var(--alpha-bg);color:var(--alpha)}.b-beta{background:var(--beta-bg);color:var(--beta)}
.b-plain{border-color:var(--line);color:var(--ink2)}
.b-gcp{color:var(--gcp);border-color:currentColor}.b-aws{color:var(--aws);border-color:currentColor}.b-azure{color:var(--azure);border-color:currentColor}.b-vendor{color:var(--ink);border-color:var(--ink3)}
.stat{font-size:26px;font-weight:700}.stat small{font-size:12px;color:var(--ink3);font-weight:500;margin-left:4px}
.bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--line2);margin:10px 0 6px}
.bar i{display:block}.bar .o{background:var(--off)}.bar .e{background:var(--ext)}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line2);vertical-align:top}
th{font-size:12px;color:var(--ink3);font-weight:600;background:var(--bg)}
tr:last-child td{border-bottom:0}
.hero{padding:26px 0 8px}.hero h1{font-size:32px}
.big{width:100%;padding:14px 16px;font:inherit;font-size:16px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);margin:16px 0 6px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px}
@media(max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}header{flex-wrap:wrap}}
.side .card{margin-bottom:14px;min-width:0;overflow-wrap:anywhere}.side h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink3)}
.kv{display:grid;grid-template-columns:90px minmax(0,1fr);gap:4px 10px;font-size:13px}.kv div:nth-child(odd){color:var(--ink3)}
.crumbs{font-size:13px;color:var(--ink3);margin-bottom:8px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:22px 0 0}
.tabs button{font:inherit;font-weight:500;background:none;border:0;padding:8px 12px;color:var(--ink2);cursor:pointer;border-bottom:2px solid transparent}
.tabs button.on{color:var(--ink);border-color:var(--clay)}
.fields{background:var(--panel);border:1px solid var(--line);border-top:0;border-radius:0 0 10px 10px}
.ff{display:flex;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line2)}
.ff input{flex:1;padding:6px 10px;border:1px solid var(--line);border-radius:6px;font:inherit;background:var(--bg);color:var(--ink)}
.f{padding:7px 12px 7px calc(28px + var(--d)*18px);border-bottom:1px solid var(--line2);cursor:pointer}
.f:hover{background:var(--bg)}
.f .n{font-family:var(--mono);font-size:12.5px;font-weight:500}.f .t{font-family:var(--mono);font-size:11.5px;color:var(--ink3);margin-left:6px}
.f .d{color:var(--ink2);font-size:13px;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.f.open .d{display:block}
.f.add{box-shadow:inset 3px 0 0 var(--ext);background:var(--ext-bg)}
.f.rem{box-shadow:inset 3px 0 0 var(--ink3)}.f.rem .n{text-decoration:line-through;color:var(--ink3)}
.f.chg{box-shadow:inset 3px 0 0 var(--alpha);background:var(--alpha-bg)}
.f.ctx{opacity:.6}
.f .car{font:inherit;font-size:11px;width:16px;margin-left:-18px;padding:0;border:0;background:none;color:var(--ink3);cursor:pointer;display:inline-block;text-align:left}
.f .car:hover{color:var(--ink)}
.f .inside{font-size:11.5px;margin-left:8px}.f .inside i{font-style:normal;padding:0 5px;border-radius:99px;margin-left:3px}
.i-add{background:var(--ext-bg);color:var(--ext)}.i-rem{background:var(--line2);color:var(--ink2);border:1px solid var(--line)}.i-chg{background:var(--alpha-bg);color:var(--alpha)}
.f .was{font-family:var(--mono);font-size:11.5px;color:var(--alpha);margin-top:2px}
.ff{flex-wrap:wrap;align-items:center}.ff label{white-space:nowrap;font-size:13px;display:flex;gap:5px;align-items:center}
.ff .tb{font:inherit;font-size:12.5px;padding:4px 9px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink2);cursor:pointer}.ff .tb:hover{border-color:var(--clay);color:var(--ink)}
.cmp{display:flex;gap:6px 14px;flex-wrap:wrap;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line2);font-size:13px;background:var(--bg)}
.cmp .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.exs{display:flex;gap:6px;flex-wrap:wrap;padding:12px 14px 0}
.exhead{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;padding:12px 14px 0;font-size:13px}
.exhead .tb{margin-left:auto;font:inherit;font-size:12.5px;padding:3px 9px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink2);cursor:pointer}
pre.ex{margin:0;padding:12px 14px 14px;overflow:auto;max-height:640px}
.callout{border:1px solid var(--line);border-left:3px solid var(--ext);background:var(--panel);border-radius:8px;padding:12px 14px;margin:14px 0}
.callout.o{border-left-color:var(--off)}
.md{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px 20px;margin-top:14px;overflow:auto}
.md.doc{padding:0 20px}.md.doc summary{cursor:pointer;padding:12px 0;list-style-position:outside}.md.doc[open] summary{border-bottom:1px solid var(--line2);margin-bottom:4px}
.md table{font-size:13px}.md pre{background:var(--bg);padding:10px;border-radius:6px;overflow:auto}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:12.5px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:var(--panel);color:var(--ink2);cursor:pointer}
.chip.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.card{border-radius:12px}a.card:hover{border-color:var(--clay)}
:focus-visible{outline:2px solid var(--clay);outline-offset:2px;border-radius:2px}
/* Landing */
.land{padding:56px 0 8px;max-width:820px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--clay);margin-bottom:14px}
.land h1{font-size:clamp(2.1rem,1.5rem + 2.8vw,3.4rem);font-weight:700;line-height:1.05;letter-spacing:-.02em;margin:0}
.land h1 em{font-style:normal;color:var(--clay)}
.land .lede{font-size:clamp(1.05rem,1rem + .3vw,1.25rem);color:var(--ink2);margin:16px 0 0;max-width:620px}
.land .big{margin:28px 0 8px;padding:16px 18px;font-size:17px;border-radius:12px;border-width:2px}
.land .big:focus{border-color:var(--clay);outline:none}
.try{font-size:13px;color:var(--ink3);display:flex;flex-wrap:wrap;gap:4px 0;align-items:baseline}.try>span{margin-right:8px}
body.home #q{visibility:hidden}
.mini .soon{color:var(--ink3)}.mini .soon b{color:var(--ink2)}.try a{font-family:var(--mono);font-size:12.5px;margin-right:10px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:40px 0 8px}
.stats div{background:var(--panel);padding:18px 20px}.stats b{display:block;font-family:var(--display);font-size:30px;line-height:1.1}.stats span{font-size:13px;color:var(--ink2)}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.three .card h3{margin:0 0 6px;font-size:17px}.three .card p{margin:0;color:var(--ink2);font-size:14px}
.three .k{font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--clay);margin-bottom:8px}
.mini{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.mini a{display:flex;flex-direction:column;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:inherit}
.mini a:hover{border-color:var(--clay);text-decoration:none}.mini b{font-family:var(--display);font-size:16px}.mini span{font-size:12.5px;color:var(--ink3)}
.mini .bar{margin:6px 0 0;height:4px}
.agents{margin-top:40px;border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}
.agents .ah{display:flex;gap:8px 14px;align-items:baseline;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line2);font-size:14px}
.agents .ah b{font-family:var(--display);font-size:16px}.agents .ah span{color:var(--ink3)}
.agents .ah .acts{margin-left:auto;display:flex;gap:12px;align-items:baseline;font-size:13px}
.agents button{font:inherit;font-size:13px;padding:4px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);cursor:pointer}.agents button:hover{border-color:var(--clay)}
.agents .ah.mcp{border-top:1px solid var(--line2);border-bottom:0}.agents .ah.mcp b{font-size:14px}.agents .ah.mcp code{font-size:12.5px;overflow-wrap:anywhere}
.agents pre{margin:0;padding:12px 16px;font-size:12px;line-height:1.6;color:var(--ink2);white-space:pre-wrap;max-height:9.6em;overflow:auto;background:var(--bg);cursor:copy}
.more{display:flex;justify-content:space-between;align-items:baseline;gap:10px}.more a{font-size:14px}
footer{max-width:1180px;margin:40px auto 0;padding:24px 28px 40px;border-top:1px solid var(--line);color:var(--ink3);font-size:13px;display:flex;gap:18px;flex-wrap:wrap}
footer a{color:var(--ink2)}
@media(max-width:700px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.three{grid-template-columns:1fr}.land{padding-top:28px}main{padding:20px 16px}header{padding:10px 16px;gap:10px}header nav{order:3;width:100%;overflow-x:auto;white-space:nowrap;scrollbar-width:none}body.home #q{display:none}}
.res{padding:10px 14px;border-bottom:1px solid var(--line2);display:block;color:inherit}.res:hover{background:var(--bg);text-decoration:none}
.res .k{font-weight:600}.res .g{font-family:var(--mono);font-size:12px;color:var(--ink3);margin-left:6px}
.res .why{font-size:12.5px;color:var(--ink2)}
.list{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.cols{columns:3 260px;column-gap:24px}.cols a{display:block;break-inside:avoid;padding:2px 0;overflow-wrap:anywhere}
.sec{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink3);margin:20px 0 6px;font-weight:600}
.dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:0}
.loading{color:var(--ink3);padding:40px 0}
.fbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:16px 0 8px;position:sticky;top:57px;background:var(--bg);padding:8px 0;z-index:3}
.fin{flex:1;min-width:220px;max-width:400px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font:inherit}
.tfeq{display:inline-block;font-family:var(--mono);font-size:11.5px;color:var(--ink2);border:1px dashed var(--ink3);border-radius:5px;padding:0 6px;margin:1px 0;max-width:100%;overflow-wrap:anywhere}
.tfeq::before{content:'≈ ';color:var(--ink3);font-family:var(--body)}
.tfmap{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:3px 0}.tfmap .arr{color:var(--ink3)}
.fcount{font-size:12.5px;margin-left:auto}
</style>
</head>
<body>
<header>
  <a class="logo" href="#home" aria-label="KRM Registry home"><svg viewBox="0 0 64 64" aria-hidden="true"><g transform="translate(0 2)"><rect class="c" x="8" y="18" width="14" height="42" rx="7" transform="rotate(8 15 60)"/><circle class="c" cx="32" cy="38" r="4.5"/><rect class="m" x="42" y="18" width="14" height="42" rx="7" transform="rotate(-8 49 60)"/><g class="cl" stroke-width="4" stroke-linecap="round" fill="none"><line x1="32" y1="3" x2="32" y2="10"/><line x1="20" y1="7" x2="24.5" y2="12.5"/><line x1="44" y1="7" x2="39.5" y2="12.5"/></g></g></svg>KRM Registry<small>by High Five Labs</small></a>
  <nav><a href="#surfaces">Clouds &amp; vendors</a><a href="#numbers">Coverage</a><a href="#providers">Providers</a><a href="#packages">Packages</a><a href="#about">Guide</a></nav>
  <input id="q" placeholder="Search kinds, packages, Terraform types…">
  <button class="theme" id="theme" type="button" aria-label="Switch light or dark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
</header>
<main id="app"><div class="loading">Loading the index…</div></main>
<footer><span>KRM Registry · built from each provider's published CRDs</span><a href="#about">Guide</a><a href="llms.txt">llms.txt</a><a href="https://highfivelabs.dev">High Five Labs</a></footer>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let C, KBY={}, CBY={}, PBY={}, SHARDS={}, Q='';
let SURF={}, SURFS=[], CLOUDS=[], VENDORS=[];
const kslug=k=>'k-'+k.provider+'--'+k.group.replace(/\./g,'-')+'--'+k.kind;
const klink=(k,label)=>`<a href="#${kslug(k)}">${esc(label??k.kind)}</a>`;
const cslug=c=>'p-'+c.cloud+'-'+c.name;
const svcslug=(s,svc)=>'svc-'+s+'--'+svc.replace(/[^A-Za-z0-9-]/g,'-');
const badge=(t,cls)=>`<span class="badge b-${cls||t}">${esc(t)}</span>`;
const tierBadge=t=>badge(t,t==='official'?'official':t==='community'?'plain':'extension');
const tierB=k=>tierBadge(k.tier);
const stabB=k=>badge(k.stability==='ga'?'GA':k.stability,k.stability);
const surfB=s=>`<span class="badge b-${['gcp','aws','azure'].includes(s)?s:'vendor'}">${['gcp','aws','azure'].includes(s)?s.toUpperCase():esc(SURF[s]||s)}</span>`;
const fmt=n=>n.toLocaleString();
const md=s=>window.marked?marked.parse(s||''):`<pre>${esc(s)}</pre>`;
const agentUrl=k=>`kinds/${k.provider}/${k.group}/${k.kind}.md`;
const shardUrl=k=>C.packs?C.packs[k.provider+'/'+k.group]:`data/k/${k.provider}/${k.group}.json`;
async function shard(k){const u=shardUrl(k); if(!SHARDS[u]) SHARDS[u]=fetch(u).then(r=>r.json()); const d=await SHARDS[u]; return (C.packs?d[k.group]:d).find(x=>x.kind===k.kind)}
let CHARTS=null; async function chartData(c){ if(C.packs){CHARTS??=fetch('data/charts.json').then(r=>r.json()); return (await CHARTS)[c.cloud+'-'+c.name]} return fetch(`data/charts/${c.cloud}-${c.name}.json`).then(r=>r.json())}

fetch('data/catalog.json').then(r=>r.json()).then(c=>{
  C=c; SURF=Object.fromEntries(Object.entries(c.surfaces).map(([k,v])=>[k,v.title])); SURFS=Object.keys(c.surfaces).filter(s=>c.kinds.some(k=>k.surface===s)||c.surfaces[s].notes); CLOUDS=SURFS.filter(s=>c.surfaces[s].category==='cloud'); VENDORS=SURFS.filter(s=>c.surfaces[s].category!=='cloud');
  c.kinds.forEach(k=>{KBY[kslug(k)]=k; k._id=k.id}); c.charts.forEach(ch=>CBY[cslug(ch)]=ch); c.providers.forEach(p=>PBY[p.id]=p);
  C.byId={}; c.kinds.forEach(k=>C.byId[k.id]=k);
  C.overlaidBy={}; c.kinds.forEach(k=>{if(k.overlays)(C.overlaidBy[k.overlays.id]??=[]).push(k)});
  C.chartById={}; c.charts.forEach(ch=>C.chartById[ch.id]=ch);
  route();
});

// ---------------------------------------------------------------- search
function search(q){
  q=q.trim().toLowerCase(); if(!q) return home();
  const terms=q.split(/\s+/), R=[];
  for(const k of C.kinds){let s=0,why='';const kn=k.kind.toLowerCase();
    for(const t of terms){let ts=0;
      if(kn===t) ts=100; else if(kn.startsWith(t)) ts=60; else if(kn.includes(t)) ts=35;
      for(const a of k.api||[]){ for(const tf of a.tf){ if(tf===t){ts=Math.max(ts,120);why=tfeq(tf)} else if(tf.includes(t)&&ts<45){ts=45;why=tfeq(tf)}}
        if(a.api.toLowerCase().includes(t)&&ts<40){ts=40;why=`API <code>${esc(a.api)}</code>`}}
      if(!ts&&k.group.includes(t)) ts=15; if(!ts&&k.service.toLowerCase().includes(t)) ts=12; if(!ts&&(k.desc||'').toLowerCase().includes(t)) ts=3;
      if(!ts){s=0;break} s+=ts}
    if(s){ if(k.tier==='official') s+=2; if(k.cloudcontrol) s-=3; R.push([s,'k',k,why])}}
  for(const c of C.charts){let s=0;const hay=(c.name+' '+c.desc+' '+(c.module.module||'')+' '+c.keywords.join(' ')).toLowerCase();
    for(const t of terms){ if(c.name===t) s+=110; else if(c.name.includes(t)) s+=50; else if(hay.includes(t)) s+=10; else {s=0;break}}
    if(s) R.push([s,'c',c])}
  R.sort((a,b)=>b[0]-a[0]);
  return `<h1>Results for “${esc(q)}”</h1><div class="sub">${R.length} matches${R.length>80?', showing 80':''}</div><h2></h2><div class="list">${R.slice(0,80).map(([s,t,x,why])=>t==='k'?
    `<a class="res" href="#${kslug(x)}"><span class="k">${esc(x.kind)}</span><span class="g">${esc(x.group)}/${esc(x.version)}</span> &nbsp;${surfB(x.surface)} ${tierB(x)} ${stabB(x)}${x.overlays?' '+badge('overlay','plain'):''}<div class="why">${why?why+' · ':''}${esc(PBY[x.provider].title)}${x.usedBy?.length?` · used by ${x.usedBy.length} package${x.usedBy.length>1?'s':''}`:''}</div></a>`:
    `<a class="res" href="#${cslug(x)}"><span class="k">${esc(x.name)}</span><span class="g">package ${esc(x.cloud)}/${esc(x.name)} ${esc(x.version)}</span> &nbsp;${surfB(x.cloud)} ${badge('package','plain')}<div class="why">${esc(x.desc)}</div></a>`).join('')||'<div class="res">Nothing matched.</div>'}</div>`}

  ${f.refused.length?`<h2>Module variables not yet carried</h2><table><tr><th>Variable</th><th>Why</th><th>Reason</th></tr>${f.refused.map(r=>`<tr><td class="mono">${esc(r.variable)}${r.partial?' <span class="muted">(partial)</span>':''}</td><td>${badge(r.kind,r.kind==='gap'?'alpha':r.kind==='alpha'?'beta':'plain')}</td><td style="font-size:13px">${esc(r.reason)}</td></tr>`).join('')}</table>`:''}
  <div class="tabs">${['readme','values','outputs'].map(t=>`<button class="${CTAB===t?'on':''}" onclick="CTAB='${t}';chartPage(CBY[location.hash.slice(1)])">${t==='readme'?'README':t==='values'?`Values <span class="muted">${f.values.length}</span>`:`Outputs <span class="muted">${Object.keys(f.outputExprs).length}</span>`}</button>`).join('')}</div>
  <div class="fields">${CTAB==='readme'?`<div class="md" style="border:0;margin:0">${md(f.readme)}</div>`:CTAB==='values'?f.values.map(v=>{const parts=v.p.split('.');return `<div class="f" style="--d:${parts.length-1}" onclick="this.classList.toggle('open')"><span class="n">${esc(parts.at(-1))}</span><span class="t">${esc(v.t)}</span>${v.df!==undefined?`<span class="t">default: ${esc(JSON.stringify(v.df))}</span>`:''}${v.d?`<div class="d">${esc(v.d)}</div>`:''}</div>`}).join(''):Object.entries(f.outputExprs).map(([n,e])=>`<div class="f open"><span class="n">${esc(n)}</span><div class="d mono" style="font-size:11.5px">${esc(e)}</div></div>`).join('')||'<div class="f muted">None</div>'}</div>
  </div><div class="side">${!c.module.repo?`<div class="card"><h4>Origin</h4>An original package, not a port of a Terraform module.</div>`:''}${c.module.repo?`<div class="card"><h4>Ported from a Terraform module</h4><div style="margin-bottom:8px">${famB(c.module)}</div><div class="kv"><div>Repo</div><div><a href="${esc(c.module.repo)}">${modRepo(c.module)} ↗</a></div>${modPath(c.module)?`<div>Path</div><div class="mono">${modPath(c.module)}</div>`:''}<div>Release</div><div class="mono"><a href="${esc(c.module.module_url)}">${esc(c.module.version)} ↗</a></div>${c.module.commit?`<div>Commit</div><div class="mono">${esc(c.module.commit.slice(0,12))}</div>`:''}<div>License</div><div>${esc(c.module.license)}</div>${c.module.registry_url?`<div>Registry</div><div><a href="${esc(c.module.registry_url)}">Terraform Registry ↗</a></div>`:''}<div>Synced</div><div>${esc(c.module.synced)}</div><div>Upstream</div><div>${c.upstream?.latest?(c.upstream.behind?`<b>${esc(c.upstream.latest)}</b> is out ${upB(c)}`:`${esc(c.upstream.latest)} ${upB(c)}`)+`<div class="muted" style="font-size:11.5px">checked via ${esc(c.upstream.via)}</div>`:'<span class="muted">unknown</span>'}</div></div></div>`:''}</div>
  <div class="card"><h4>Install</h4><pre class="mono" style="margin:0;overflow:auto;font-size:11.5px">helm install my-${esc(c.name)} \\\n  oci://ghcr.io/highfivelabs/charts/${esc(c.cloud)}/${esc(c.name)} \\\n  --version ${esc(c.version)} -f values.yaml</pre><div class="muted" style="font-size:11.5px;margin-top:6px">Illustrative OCI path.</div></div>
  <div class="card"><h4>Source</h4><a href="https://github.com/highfivelabs/krm-packages/tree/main/charts/${esc(c.cloud)}/${esc(c.name)}">krm-packages/charts/${esc(c.cloud)}/${esc(c.name)}</a> ${C.packs?'':`· <a href="packages/${esc(c.cloud)}/${esc(c.name)}.md">Markdown</a> `}· <a href="${C.packs?'data/charts.json':`data/charts/${c.cloud}-${c.name}.json`}">JSON</a></div></div></div>`}
let CTAB='readme';

// ---------------------------------------------------------------- about
function about(){const row=(t,d)=>`<tr><td style="white-space:nowrap">${t}</td><td>${d}</td></tr>`;
return `<div style="max-width:760px"><h1>Guide</h1>
<p class="sub">Providers are controllers and the CRDs they install. Packages are Helm charts made of those CRDs' objects. Every page comes from the CRDs at a pinned release.</p>
<h2>Badges</h2><table>
${row(badge('official','official'),'Published by the cloud or vendor (Config Connector, ACK, ASO, …).')}
${row(badge('extension','extension'),'High Five Labs kinds for what the official controllers don\'t cover, in their own API group.')}
${row(badge('overlay','plain'),'An extension kind with the same name as an official one. Its page compares the two field by field.')}
${row(`${badge('ga','ga')} ${badge('beta','beta')} ${badge('alpha','alpha')}`,'The kind\'s API stability.')}
</table>
<h2>Examples</h2><table>
${row('<b>tested live</b>','Created, updated, repaired after drift and deleted against the real API.')}
${row('<b>upstream test</b>','From the controller\'s own test suite, at the release indexed here.')}
${row('<b>fake API</b>','Run against a fake API built from the vendor\'s spec only.')}
${row('<b>minimal</b>','Required fields only, generated from the CRD. Untested.')}
</table>
<h2>For agents</h2>
<p>MCP server: <code>https://registry.highfivelabs.dev/mcp</code> (streamable HTTP, no sign-in), with <code>list_clouds</code>, <code>search_kinds</code>, <code>get_kind</code>, <code>kinds_for_terraform</code>, <code>list_providers</code> and <code>get_package</code>. In Claude Code: <code>claude mcp add --transport http krm-registry https://registry.highfivelabs.dev/mcp</code>.</p>
<p><a href="prompt.txt">prompt.txt</a> is a prompt to paste into a coding agent. <a href="llms.txt">llms.txt</a> describes the layout. Every kind is one JSON fetch (all of its fields, examples and references), and the same pages exist as Markdown.</p>
<h2>This build</h2>
<div class="kv" style="grid-template-columns:150px 1fr;font-size:14px"><div>Config Connector</div><div class="mono">${esc(PBY['config-connector'].version)}</div><div>ASO</div><div class="mono">${esc(PBY['aso'].version)}</div><div>ACK</div><div>${PBY['ack'].controllers} controllers, each at its latest release</div><div>Extensions, packages</div><div>main</div><div>Generated</div><div>${esc(C.generated)}</div></div>
<details style="margin-top:28px"><summary><b>Adding a provider</b></summary>
<p>A repository joins with a manifest at its root, read at each release tag:</p>
<pre class="md mono" style="padding:14px">schema: 1
id: aso-extensions
surface: azure
publisher: High Five Labs
extends: aso                  # optional: the provider this one overlays
crds: [config/crds/*.yaml]
kind_docs: docs/kinds         # optional: docs/kinds/&lt;Kind&gt;.md
coverage: docs/coverage/resources.csv   # optional: kind → API resource</pre>
<p>A kind doc is Markdown whose front matter names the kinds it covers. Without kind docs, a kind gets its description from the README's kind table, then from the CRD alone.</p></details></div>`}
</script>
</body>
</html>
